<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yas!Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lavender: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        },
                        offwhite: {
                            50: '#fcfcfc',
                            100: '#f8f8f9',
                            200: '#f1f1f3',
                            300: '#e4e4e7',
                        },
                        pastel: {
                            pink: '#ffd1dc',
                            blue: '#bae1ff',
                            yellow: '#ffffba',
                            teal: '#baffc9',
                            purple: '#e8c5ff',
                            peach: '#ffdfba'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @media print {
            body { background: white !important; color: black !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            @page { size: A4 landscape; margin: 10mm; }
            .print-container { width: 100% !important; overflow: visible !important; box-shadow: none !important; border: none !important; }
        }
        .print-only { display: none; }
        .deleted-period-pattern {
            background: repeating-linear-gradient(
                45deg,
                rgba(239, 68, 68, 0.08),
                rgba(239, 68, 68, 0.08) 10px,
                rgba(239, 68, 68, 0.18) 10px,
                rgba(239, 68, 68, 0.18) 20px
            );
        }
        .dark .deleted-period-pattern {
            background: repeating-linear-gradient(
                45deg,
                rgba(248, 113, 113, 0.12),
                rgba(248, 113, 113, 0.12) 10px,
                rgba(248, 113, 113, 0.22) 10px,
                rgba(248, 113, 113, 0.22) 20px
            );
        }
        html { scroll-behavior: smooth; }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body class="h-full bg-offwhite-100 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-100 font-sans transition-colors duration-200 flex flex-col">

    <header class="no-print bg-white/80 dark:bg-zinc-800/80 backdrop-blur-md border-b border-offwhite-300 dark:border-zinc-700 sticky top-0 z-30 px-4 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3 rtl:space-x-reverse">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-lavender-400 to-pastel-pink flex items-center justify-center text-white font-bold text-lg shadow-sm">
                <i class="fa-solid fa-calendar-days"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight flex items-center gap-2">
                    Yas!Schedule
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-lavender-100 dark:bg-lavender-900 text-lavender-700 dark:text-lavender-300">v2.5</span>
                </h1>
                <p class="text-xs text-zinc-500 dark:text-zinc-400" data-i18n="subtitle">Minimalist Timetable Planner</p>
            </div>
        </div>

        <div class="flex items-center flex-wrap gap-2 sm:gap-3">
            <select id="langSelect" class="bg-offwhite-200 dark:bg-zinc-700 text-xs font-medium px-2.5 py-2 rounded-xl border border-transparent focus:border-lavender-400 outline-none cursor-pointer">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="ar">العربية</option>
                <option value="darija">Darija</option>
            </select>

            <button id="themeToggleBtn" class="w-9 h-9 rounded-xl bg-offwhite-200 dark:bg-zinc-700 flex items-center justify-center text-zinc-600 dark:text-zinc-300 hover:bg-lavender-100 transition-colors" title="Toggle Theme">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block"></i>
            </button>

            <button id="authBtn" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-lavender-100 dark:bg-lavender-900/50 text-lavender-700 dark:text-lavender-300 text-xs font-semibold hover:bg-lavender-200 transition-colors">
                <i class="fa-brands fa-google"></i>
                <span id="authBtnText">Sign In</span>
            </button>

            <button onclick="window.print()" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-pastel-blue/60 dark:bg-blue-900/40 text-blue-800 dark:text-blue-200 text-xs font-semibold hover:bg-pastel-blue transition-colors">
                <i class="fa-solid fa-print"></i>
                <span data-i18n="printPdf">Print / PDF</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 flex flex-col gap-6 overflow-x-hidden">
        
        <div class="no-print bg-white dark:bg-zinc-800 p-4 rounded-2xl border border-offwhite-300 dark:border-zinc-700 shadow-sm flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
            <div class="flex items-center gap-3 flex-wrap">
                <div class="flex items-center gap-2">
                    <label for="timetableSelector" class="text-xs font-semibold text-zinc-500 uppercase tracking-wider" data-i18n="schedule">Schedule:</label>
                    <select id="timetableSelector" class="bg-offwhite-100 dark:bg-zinc-900 text-sm font-semibold px-3 py-2 rounded-xl border border-offwhite-300 dark:border-zinc-700 focus:border-lavender-500 outline-none min-w-[160px]">
                    </select>
                </div>
                <button id="newTimetableBtn" class="px-3 py-2 bg-offwhite-200 dark:bg-zinc-700 hover:bg-lavender-100 dark:hover:bg-zinc-600 rounded-xl text-xs font-semibold transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-[10px]"></i> <span data-i18n="newSchedule">New Schedule</span>
                </button>
                <button id="renameTimetableBtn" class="px-3 py-2 bg-offwhite-200 dark:bg-zinc-700 hover:bg-lavender-100 dark:hover:bg-zinc-600 rounded-xl text-xs font-semibold transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-pen text-[10px]"></i> <span data-i18n="rename">Rename</span>
                </button>
                <button id="deleteTimetableBtn" class="px-3 py-2 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 hover:bg-red-100 rounded-xl text-xs font-semibold transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-trash text-[10px]"></i> <span data-i18n="delete">Delete</span>
                </button>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <button id="openSubjectsBtn" class="px-3.5 py-2 bg-pastel-pink/70 dark:bg-pink-950/40 text-pink-900 dark:text-pink-200 rounded-xl text-xs font-semibold hover:bg-pastel-pink transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-book"></i> <span data-i18n="subjectLibrary">Subjects Library</span>
                </button>
                <button id="openSettingsBtn" class="px-3.5 py-2 bg-pastel-teal/70 dark:bg-teal-950/40 text-teal-900 dark:text-teal-200 rounded-xl text-xs font-semibold hover:bg-pastel-teal transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-gear"></i> <span data-i18n="settings">Settings & Hours</span>
                </button>
                <button id="openExcludedBtn" class="px-3.5 py-2 bg-pastel-yellow/70 dark:bg-yellow-950/40 text-yellow-900 dark:text-yellow-200 rounded-xl text-xs font-semibold hover:bg-pastel-yellow transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-ban"></i> <span data-i18n="breaksAndSkips">Breaks & Skips</span>
                </button>
            </div>
        </div>

        <div class="bg-white dark:bg-zinc-800 rounded-3xl border border-offwhite-300 dark:border-zinc-700 shadow-sm p-4 sm:p-6 flex flex-col gap-6 print-container">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-offwhite-300 dark:border-zinc-700 pb-4">
                <div>
                    <h2 id="liveTableTitle" class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-white">My Weekly Schedule</h2>
                    <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5" id="tableSubtitle">Click on any time slot cell to add a lesson.</p>
                </div>

                <div class="flex items-center gap-3">
                    <div class="flex bg-offwhite-200 dark:bg-zinc-700 p-1 rounded-xl text-xs font-semibold">
                        <button id="viewModeVertical" class="px-3 py-1.5 rounded-lg bg-white dark:bg-zinc-800 shadow-xs transition-all" data-i18n="vertical">Vertical</button>
                        <button id="viewModeHorizontal" class="px-3 py-1.5 rounded-lg text-zinc-600 dark:text-zinc-400 transition-all" data-i18n="horizontal">Horizontal</button>
                    </div>

                    <button id="resetTableBtn" class="no-print px-3 py-1.5 text-xs font-semibold text-zinc-500 hover:text-red-600 dark:text-zinc-400 dark:hover:text-red-400 transition-colors">
                        <i class="fa-solid fa-rotate-right mr-1"></i> <span data-i18n="resetTable">Reset Table</span>
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto w-full rounded-2xl border border-offwhite-300 dark:border-zinc-700">
                <div id="timetableGridWrapper" class="min-w-[700px]">
                </div>
            </div>
        </div>
    </main>

    <!-- 1. Lesson Modal (Add/Edit with Slot Span selection) -->
    <div id="lessonModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-zinc-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-offwhite-300 dark:border-zinc-700 flex flex-col gap-4 relative animate-in fade-in zoom-in-95 duration-150">
            <div class="flex items-center justify-between border-b border-offwhite-300 dark:border-zinc-700 pb-3">
                <h3 id="lessonModalTitle" class="font-bold text-lg" data-i18n="addLesson">Add Lesson</h3>
                <button onclick="closeModal('lessonModal')" class="w-8 h-8 rounded-full bg-offwhite-200 dark:bg-zinc-700 flex items-center justify-center text-zinc-500 hover:bg-offwhite-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="lessonForm" class="flex flex-col gap-4">
                <input type="hidden" id="lessonId">
                <input type="hidden" id="lessonDay">
                <input type="hidden" id="lessonTimeSlotIndex">

                <div>
                    <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="subject">Subject</label>
                    <input type="text" id="lessonSubject" list="subjectsDatalist" required class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none" placeholder="Select or type subject...">
                    <datalist id="subjectsDatalist"></datalist>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="startTime">Start Time</label>
                        <input type="time" id="lessonStartTime" required class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="endTime">End Time</label>
                        <input type="time" id="lessonEndTime" required class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="slotSpan">Duration in Slots (Span)</label>
                    <select id="lessonSlotSpan" class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none">
                        <option value="1">1 Slot (Normal)</option>
                        <option value="2">2 Slots (Double)</option>
                        <option value="3">3 Slots (Triple)</option>
                        <option value="4">4 Slots</option>
                        <option value="5">5 Slots</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="teacher">Teacher (Optional)</label>
                        <input type="text" id="lessonTeacher" class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none" placeholder="Mr. Smith">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="room">Room / Location</label>
                        <input type="text" id="lessonRoom" class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none" placeholder="Room 302">
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2">
                    <button type="button" id="deleteLessonBtn" class="px-4 py-2 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 rounded-xl text-xs font-semibold hover:bg-red-100 transition-colors hidden">
                        <i class="fa-solid fa-trash mr-1"></i> <span data-i18n="delete">Delete</span>
                    </button>
                    <div class="flex items-center gap-2 ml-auto">
                        <button type="button" onclick="closeModal('lessonModal')" class="px-4 py-2 bg-offwhite-200 dark:bg-zinc-700 rounded-xl text-xs font-semibold hover:bg-offwhite-300" data-i18n="cancel">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-lavender-600 text-white rounded-xl text-xs font-semibold hover:bg-lavender-700 transition-colors shadow-sm" data-i18n="save">Save Lesson</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. Subjects Library Modal -->
    <div id="subjectsModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-zinc-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-offwhite-300 dark:border-zinc-700 flex flex-col gap-4 relative max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-offwhite-300 dark:border-zinc-700 pb-3">
                <h3 class="font-bold text-lg" data-i18n="subjectLibrary">Subjects Library</h3>
                <button onclick="closeModal('subjectsModal')" class="w-8 h-8 rounded-full bg-offwhite-200 dark:bg-zinc-700 flex items-center justify-center text-zinc-500 hover:bg-offwhite-300"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="subjectForm" class="flex gap-2 items-center bg-offwhite-100 dark:bg-zinc-900 p-3 rounded-2xl border border-offwhite-300 dark:border-zinc-700">
                <input type="text" id="newSubjectName" required placeholder="Subject Name (e.g. Mathematics)" class="flex-1 bg-white dark:bg-zinc-800 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none">
                <input type="color" id="newSubjectColor" value="#c4b5fd" class="w-10 h-10 rounded-xl border border-offwhite-300 dark:border-zinc-700 bg-transparent cursor-pointer p-1">
                <button type="submit" class="px-4 py-2.5 bg-lavender-600 text-white rounded-xl text-xs font-semibold hover:bg-lavender-700 transition-colors" data-i18n="add">Add</button>
            </form>

            <div id="subjectsListContainer" class="flex flex-col gap-2 max-h-60 overflow-y-auto pr-1">
            </div>
        </div>
    </div>

    <!-- 3. Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-zinc-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-offwhite-300 dark:border-zinc-700 flex flex-col gap-4 relative">
            <div class="flex items-center justify-between border-b border-offwhite-300 dark:border-zinc-700 pb-3">
                <h3 class="font-bold text-lg" data-i18n="settings">Settings & Hours</h3>
                <button onclick="closeModal('settingsModal')" class="w-8 h-8 rounded-full bg-offwhite-200 dark:bg-zinc-700 flex items-center justify-center text-zinc-500 hover:bg-offwhite-300"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="settingsForm" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="tableTitle">Table Title</label>
                    <input type="text" id="settingTitleInput" class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="daysCount">Number of Days (5-7)</label>
                        <input type="number" id="settingDaysCount" min="5" max="7" class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="slotsCount">Number of Slots (up to 24)</label>
                        <input type="number" id="settingSlotsCount" min="1" max="24" class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="startTimeSlot">First Slot Start Time</label>
                        <input type="time" id="settingStartTime" class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="slotDuration">Slot Duration (Minutes)</label>
                        <input type="number" id="settingSlotDuration" min="15" max="180" step="5" class="w-full bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3.5 py-2 text-sm focus:border-lavender-500 outline-none">
                    </div>
                </div>

                <div class="flex justify-end pt-2">
                    <button type="submit" class="px-5 py-2.5 bg-lavender-600 text-white rounded-xl text-xs font-semibold hover:bg-lavender-700 transition-colors shadow-sm" data-i18n="saveSettings">Save Settings</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 4. Breaks & Skips Modal (Excluded Times) -->
    <div id="excludedModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-zinc-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-offwhite-300 dark:border-zinc-700 flex flex-col gap-4 relative max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-offwhite-300 dark:border-zinc-700 pb-3">
                <h3 class="font-bold text-lg" data-i18n="breaksAndSkips">Breaks & Excluded Times</h3>
                <button onclick="closeModal('excludedModal')" class="w-8 h-8 rounded-full bg-offwhite-200 dark:bg-zinc-700 flex items-center justify-center text-zinc-500 hover:bg-offwhite-300"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="excludeForm" class="flex flex-col gap-3 bg-offwhite-100 dark:bg-zinc-900 p-4 rounded-2xl border border-offwhite-300 dark:border-zinc-700">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="exclusionType">Type</label>
                        <select id="excludeType" class="w-full bg-white dark:bg-zinc-800 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3 py-2 text-xs outline-none">
                            <option value="delete" data-i18n="deletePeriodOpt">Delete Period (Striped / Blocked)</option>
                            <option value="skip" data-i18n="skipTimeOpt">Skip Time (Hide Slot Entirely)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="slotIndex">Slot</label>
                        <select id="excludeSlotIndex" class="w-full bg-white dark:bg-zinc-800 border border-offwhite-300 dark:border-zinc-700 rounded-xl px-3 py-2 text-xs outline-none">
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 mb-1" data-i18n="applyToDays">Apply To Days</label>
                    <div id="excludeDaysCheckboxes" class="flex flex-wrap gap-2 mt-1">
                    </div>
                </div>

                <button type="submit" class="mt-2 px-4 py-2.5 bg-lavender-600 text-white rounded-xl text-xs font-semibold hover:bg-lavender-700 transition-colors self-end" data-i18n="applyExclusion">Apply Rule</button>
            </form>

            <div>
                <h4 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2" data-i18n="activeExclusions">Active Restrictions</h4>
                <div id="exclusionsListContainer" class="flex flex-col gap-2 max-h-40 overflow-y-auto">
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        function loadLocalState() {
            const saved = localStorage.getItem('yasschedule_state_v2.5');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                    // Ensure all lessons have a span property defaulting to 1
                    Object.values(state.timetables).forEach(t => {
                        if (t.lessons) {
                            t.lessons.forEach(l => {
                                if (!l.span) l.span = 1;
                            });
                        }
                    });
                } catch (e) {
                    console.error("Local state parse error", e);
                }
            }
        }

        function saveState() {
            localStorage.setItem('yasschedule_state_v2.5', JSON.stringify(state));
            if (db && currentUser) {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'timetable_state_v2.5');
                setDoc(docRef, state).catch(err => console.error("Firestore save error", err));
            }
            showToast(translations[state.lang].toastSaved);
        }

        function loadUserData() {
            if (!db || !currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'timetable_state_v2.5');
            getDoc(docRef).then(docSnap => {
                if (docSnap.exists()) {
                    state = docSnap.data();
                    renderAll();
                }
            }).catch(err => console.error("Firestore read error", err));
        }

        function updateAuthUI() {
            const btnText = document.getElementById('authBtnText');
            if (currentUser && !currentUser.isAnonymous) {
                btnText.textContent = currentUser.displayName || translations[state.lang].signOut;
            } else {
                btnText.textContent = translations[state.lang].signIn;
            }
        }

        function setupEventListeners() {
            document.getElementById('langSelect').value = state.lang;
            document.getElementById('langSelect').addEventListener('change', (e) => {
                state.lang = e.target.value;
                document.documentElement.setAttribute('dir', ['ar', 'darija'].includes(state.lang) ? 'rtl' : 'ltr');
                renderAll();
            });

            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            document.getElementById('authBtn').addEventListener('click', async () => {
                if (!auth) {
                    showToast("Cloud authentication not initialized.");
                    return;
                }
                if (currentUser && !currentUser.isAnonymous) {
                    signOut(auth).then(() => {
                        signInAnonymously(auth);
                        showToast("Signed out.");
                    });
                } else {
                    const provider = new GoogleAuthProvider();
                    try {
                        await signInWithPopup(auth, provider);
                        showToast("Successfully signed in with Google ✓");
                    } catch (e) {
                        console.error("Google sign in error", e);
                        showToast("Sign in failed or cancelled.");
                    }
                }
            });

                if (name) {

                    state.timetables[id] = {
                        id,
                        title: name,
                        daysCount: 5,
                        slotsCount: 8,
                        startTime: '08:00',
                        slotDuration: 60,
                        lessons: [],
                        exclusions: []
                    };
                    state.activeTableId = id;
                    saveState();
                    renderAll();
                }
            });

            document.getElementById('renameTimetableBtn').addEventListener('click', () => {
                const t = state.timetables[state.activeTableId];
                if (!t) return;
                const name = prompt("Rename timetable:", t.title);
                if (name) {
                    t.title = name;
                    saveState();
                    renderAll();
                }
            });

            document.getElementById('deleteTimetableBtn').addEventListener('click', () => {
                if (Object.keys(state.timetables).length <= 1) {
                    showToast("Cannot delete the only remaining timetable.");
                    return;
                }
                if (confirm("Are you sure you want to delete this timetable?")) {
                    delete state.timetables[state.activeTableId];
                    state.activeTableId = Object.keys(state.timetables)[0];
                    saveState();
                    renderAll();
                }
            });

            document.getElementById('resetTableBtn').addEventListener('click', () => {
                if (confirm("Reset all lessons and exclusions for this timetable?")) {
                    const t = state.timetables[state.activeTableId];
                    t.lessons = [];
                    t.exclusions = [];
                    saveState();
                    renderAll();
                    showToast(translations[state.lang].toastReset);
                }
            });

            document.getElementById('openExcludedBtn').addEventListener('click', () => {

            });

            document.getElementById('subjectForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('newSubjectName').value.trim();
                const color = document.getElementById('newSubjectColor').value;
                if (name) {
                    const existing = state.subjects.find(s => s.name.toLowerCase() === name.toLowerCase());
                    if (existing) {
                        existing.color = color;
                    } else {
                        state.subjects.push({ name, color });
                    }
                    document.getElementById('newSubjectName').value = '';
                    saveState();
                    renderSubjectsList();
                    renderAll();
                }
            });

            document.getElementById('settingsForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const t = state.timetables[state.activeTableId];
                t.title = document.getElementById('settingTitleInput').value;
                t.daysCount = parseInt(document.getElementById('settingDaysCount').value);
                t.slotsCount = parseInt(document.getElementById('settingSlotsCount').value);
                t.startTime = document.getElementById('settingStartTime').value;
                t.slotDuration = parseInt(document.getElementById('settingSlotDuration').value);
                
                closeModal('settingsModal');
                saveState();
                renderAll();
            });

            document.getElementById('excludeForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const t = state.timetables[state.activeTableId];
                const type = document.getElementById('excludeType').value;
                const slotIndex = parseInt(document.getElementById('excludeSlotIndex').value);
                
                const checkboxes = document.querySelectorAll('.exclude-day-cb:checked');
                const days = Array.from(checkboxes).map(cb => parseInt(cb.value));

                if (days.length === 0) {
                    showToast("Please select at least one day.");
                    return;
                }

                t.exclusions.push({
                    id: 'exc_' + Date.now(),
                    type,
                    slotIndex,
                    days
                });

                closeModal('excludedModal');
                saveState();
                renderAll();
            });

            document.getElementById('lessonForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const t = state.timetables[state.activeTableId];
                const id = document.getElementById('lessonId').value;
                const dayIndex = parseInt(document.getElementById('lessonDay').value);
                const slotIndex = parseInt(document.getElementById('lessonTimeSlotIndex').value);
                const span = parseInt(document.getElementById('lessonSlotSpan').value);
                const subject = document.getElementById('lessonSubject').value.trim();
                const startTime = document.getElementById('lessonStartTime').value;
                const endTime = document.getElementById('lessonEndTime').value;
                const teacher = document.getElementById('lessonTeacher').value;
                const room = document.getElementById('lessonRoom').value;

                // Validate that the lesson span doesn't exceed available slots
                if (slotIndex + span > t.slotsCount) {
                    showToast("Error: Lesson span exceeds total slots available in the schedule.");
                    return;
                }

                // Conflict detection check: check if any slot in [slotIndex, slotIndex + span - 1] overlaps with another lesson or exclusion
                for (let i = 0; i < span; i++) {
                    const checkSlot = slotIndex + i;
                    // Check exclusion
                    const hasExclusion = t.exclusions.some(exc => exc.slotIndex === checkSlot && exc.days.includes(dayIndex));
                    if (hasExclusion) {
                        showToast(translations[state.lang].conflictError);
                        return;
                    }
                    // Check other lessons
                    const conflict = t.lessons.find(l => {
                        if (l.id === id) return false;
                        if (l.dayIndex !== dayIndex) return false;
                        const lStart = l.slotIndex;
                        const lEnd = l.slotIndex + (l.span || 1) - 1;
                        return checkSlot >= lStart && checkSlot <= lEnd;
                    });
                    if (conflict) {
                        showToast(translations[state.lang].conflictError);
                        return;
                    }
                }

                if (id) {
                    const l = t.lessons.find(item => item.id === id);
                    if (l) {
                        l.subject = subject;
                        l.startTime = startTime;
                        l.endTime = endTime;
                        l.span = span;
                        l.teacher = teacher;
                        l.room = room;
                    }
                } else {
                    t.lessons.push({
                        id: 'lesson_' + Date.now(),
                        dayIndex,
                        slotIndex,
                        span,
                        subject,
                        startTime,
                        endTime,
                        teacher,
                        room
                    });
                }

                if (!state.subjects.some(s => s.name.toLowerCase() === subject.toLowerCase())) {
                    const pastelColors = ['#ffd1dc', '#bae1ff', '#ffffba', '#baffc9', '#e8c5ff', '#ffdfba'];
                    const randomColor = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                    state.subjects.push({ name: subject, color: randomColor });
                }

                closeModal('lessonModal');
                saveState();
                renderAll();
            });

            document.getElementById('deleteLessonBtn').addEventListener('click', () => {
                const t = state.timetables[state.activeTableId];
                const id = document.getElementById('lessonId').value;
                if (id) {
                    t.lessons = t.lessons.filter(l => l.id !== id);
                    closeModal('lessonModal');
                    saveState();
                    renderAll();
                    showToast("Lesson deleted.");
                }
            });
        }

        function addMinutes(timeStr, mins) {
            const [h, m] = timeStr.split(':').map(Number);
            const date = new Date();
            date.setHours(h, m + mins, 0);
            return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
        }

        function generateTimeSlots(t) {
            const slots = [];
            let current = t.startTime || '08:00';
            const duration = t.slotDuration || 60;
            for (let i = 0; i < t.slotsCount; i++) {
                const next = addMinutes(current, duration);
                slots.push({ index: i, start: current, end: next });
                current = next;
            }
            return slots;
        }

        function renderAll() {
            const t = state.timetables[state.activeTableId];
            if (!t) return;

            const langDict = translations[state.lang];
            document.documentElement.setAttribute('dir', ['ar', 'darija'].includes(state.lang) ? 'rtl' : 'ltr');
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (langDict[key]) el.textContent = langDict[key];
            });

            const selector = document.getElementById('timetableSelector');
            selector.innerHTML = '';
            Object.values(state.timetables).forEach(table => {
                const opt = document.createElement('option');
                opt.value = table.id;
                opt.textContent = table.title;
                if (table.id === state.activeTableId) opt.selected = true;
                selector.appendChild(opt);
            });

            document.getElementById('liveTableTitle').textContent = t.title;

            const btnVert = document.getElementById('viewModeVertical');
            const btnHoriz = document.getElementById('viewModeHorizontal');
            if (state.viewMode === 'vertical') {
                btnVert.className = "px-3 py-1.5 rounded-lg bg-white dark:bg-zinc-800 shadow-xs transition-all";
                btnHoriz.className = "px-3 py-1.5 rounded-lg text-zinc-600 dark:text-zinc-400 transition-all";
            } else {
                btnHoriz.className = "px-3 py-1.5 rounded-lg bg-white dark:bg-zinc-800 shadow-xs transition-all";
                btnVert.className = "px-3 py-1.5 rounded-lg text-zinc-600 dark:text-zinc-400 transition-all";
            }

            renderTimetableGrid(t);
            renderSubjectsDatalist();
            renderSubjectsList();
        }

        function renderTimetableGrid(t) {
            const wrapper = document.getElementById('timetableGridWrapper');
            const langDict = translations[state.lang];
            const daysNames = langDict.days.slice(0, t.daysCount);
            const timeSlots = generateTimeSlots(t);

            const skippedSlotsIndices = new Set();
            t.exclusions.forEach(exc => {
                if (exc.type === 'skip' && exc.days.length === t.daysCount) {
                    skippedSlotsIndices.add(exc.slotIndex);
                }
            });

            const activeSlots = timeSlots.filter(s => !skippedSlotsIndices.has(s.index));
            let html = '';

            if (state.viewMode === 'vertical') {
                // Vertical View: Days in columns, Time slots in rows with RowSpan support
                html += `<table class="w-full border-collapse text-left">`;
                html += `<thead><tr class="bg-offwhite-200 dark:bg-zinc-900 border-b border-offwhite-300 dark:border-zinc-700 text-xs font-semibold text-zinc-500 uppercase">`;
                html += `<th class="p-3 text-center border-r border-offwhite-300 dark:border-zinc-700 w-28">Time</th>`;
                daysNames.forEach((day) => {
                    html += `<th class="p-3 text-center border-r border-offwhite-300 dark:border-zinc-700">${day}</th>`;
                });
                html += `</tr></thead><tbody>`;

                // Keep track of cells to skip due to multi-slot rowspan
                // coveredCells[dIdx][slotIndex] = true if covered by a multi-slot lesson above
                const coveredCells = {};
                for (let d = 0; d < t.daysCount; d++) coveredCells[d] = {};

                activeSlots.forEach((slot) => {
                    html += `<tr class="border-b border-offwhite-200 dark:border-zinc-700/60 hover:bg-offwhite-50 dark:hover:bg-zinc-900/40 transition-colors">`;
                    
                    // Calculate composite time label if slot is spanned or normal
                    html += `<td class="p-3 text-xs font-semibold text-center border-r border-offwhite-300 dark:border-zinc-700 text-zinc-500 whitespace-nowrap bg-offwhite-100/50 dark:bg-zinc-900/30">
                        ${slot.start} → ${slot.end}
                    </td>`;

                    daysNames.forEach((day, dIdx) => {
                        if (coveredCells[dIdx][slot.index]) {
                            return; // Skip rendering cell because it's part of a rowspan above
                        }

                        const isDeleted = t.exclusions.some(exc => exc.type === 'delete' && exc.slotIndex === slot.index && exc.days.includes(dIdx));
                        const lesson = t.lessons.find(l => l.dayIndex === dIdx && l.slotIndex === slot.index);
                        const span = lesson ? (lesson.span || 1) : 1;

                        if (isDeleted) {
                            html += `<td class="p-3 border-r border-offwhite-300 dark:border-zinc-700 text-center deleted-period-pattern h-20 relative cursor-not-allowed">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-red-500 dark:text-red-400 bg-white/80 dark:bg-zinc-800/80 px-2 py-0.5 rounded-md">Break / Blocked</span>
                            </td>`;
                        } else if (lesson) {
                            const sub = state.subjects.find(s => s.name.toLowerCase() === lesson.subject.toLowerCase());
                            const bgColor = sub ? sub.color : '#c4b5fd';
                            
                            // Mark subsequent slots as covered
                            for (let sOffset = 1; sOffset < span; sOffset++) {
                                if (slot.index + sOffset < t.slotsCount) {
                                    coveredCells[dIdx][slot.index + sOffset] = true;
                                }
                            }

                            // Compute combined end time based on span
                            const endSlotIdx = slot.index + span - 1;
                            const actualEndTime = endSlotIdx < timeSlots.length ? timeSlots[endSlotIdx].end : slot.end;

                            html += `<td rowspan="${span}" class="p-3 border-r border-offwhite-300 dark:border-zinc-700 relative group cursor-pointer align-top" style="background-color: ${bgColor}25;" onclick="openEditLessonModal('${lesson.id}')">
                                <div class="flex flex-col h-full justify-between p-1 rounded-xl transition-transform hover:scale-[1.01]">
                                    <div>
                                        <div class="font-bold text-xs text-zinc-900 dark:text-zinc-100 flex items-center justify-between">
                                            <span>${lesson.subject}</span>
                                            <span class="text-[10px] font-medium opacity-75">${lesson.room || ''}</span>
                                        </div>
                                        ${lesson.teacher ? `<div class="text-[11px] text-zinc-600 dark:text-zinc-300 mt-0.5">${lesson.teacher}</div>` : ''}
                                    </div>
                                    <div class="text-[10px] font-semibold opacity-60 mt-2">${lesson.startTime} - ${actualEndTime} ${span > 1 ? `(${span} slots)` : ''}</div>
                                </div>
                            </td>`;
                        } else {
                            html += `<td class="p-3 border-r border-offwhite-300 dark:border-zinc-700 h-20 text-center cursor-pointer hover:bg-lavender-50/50 dark:hover:bg-zinc-700/30 transition-colors group" onclick="openAddLessonModal(${dIdx}, ${slot.index}, '${slot.start}', '${slot.end}')">
                                <div class="w-full h-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-lavender-500">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </div>
                            </td>`;
                        }
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table>`;

            } else {
                // Horizontal View: Time slots in columns, Days in rows with ColSpan support
                html += `<table class="w-full border-collapse text-left">`;
                html += `<thead><tr class="bg-offwhite-200 dark:bg-zinc-900 border-b border-offwhite-300 dark:border-zinc-700 text-xs font-semibold text-zinc-500 uppercase">`;
                html += `<th class="p-3 text-center border-r border-offwhite-300 dark:border-zinc-700 w-28">Day / Slot</th>`;
                activeSlots.forEach((slot) => {
                    html += `<th class="p-3 text-center border-r border-offwhite-300 dark:border-zinc-700 whitespace-nowrap">${slot.start}<br><span class="text-[10px] opacity-75">↓ ${slot.end}</span></th>`;
                });
                html += `</tr></thead><tbody>`;

                daysNames.forEach((day, dIdx) => {
                    html += `<tr class="border-b border-offwhite-200 dark:border-zinc-700/60">`;
                    html += `<td class="p-3 text-xs font-semibold border-r border-offwhite-300 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 bg-offwhite-100/50 dark:bg-zinc-900/30 whitespace-nowrap">${day}</td>`;

                    const coveredSlots = {};

                    activeSlots.forEach((slot) => {
                        if (coveredSlots[slot.index]) return;

                        const isDeleted = t.exclusions.some(exc => exc.type === 'delete' && exc.slotIndex === slot.index && exc.days.includes(dIdx));
                        const lesson = t.lessons.find(l => l.dayIndex === dIdx && l.slotIndex === slot.index);
                        const span = lesson ? (lesson.span || 1) : 1;

                        if (isDeleted) {
                            html += `<td class="p-3 border-r border-offwhite-300 dark:border-zinc-700 text-center deleted-period-pattern h-20 cursor-not-allowed"></td>`;
                        } else if (lesson) {
                            const sub = state.subjects.find(s => s.name.toLowerCase() === lesson.subject.toLowerCase());
                            const bgColor = sub ? sub.color : '#c4b5fd';

                            for (let sOffset = 1; sOffset < span; sOffset++) {
                                if (slot.index + sOffset < t.slotsCount) {
                                    coveredSlots[slot.index + sOffset] = true;
                                }
                            }

                            html += `<td colspan="${span}" class="p-3 border-r border-offwhite-300 dark:border-zinc-700 h-20 relative group cursor-pointer" style="background-color: ${bgColor}25;" onclick="openEditLessonModal('${lesson.id}')">
                                <div class="flex flex-col h-full justify-between p-1 rounded-xl">
                                    <div class="font-bold text-xs text-zinc-900 dark:text-zinc-100">${lesson.subject}</div>
                                    <div class="text-[10px] text-zinc-500">${lesson.room || ''}</div>
                                </div>
                            </td>`;
                        } else {
                            html += `<td class="p-3 border-r border-offwhite-300 dark:border-zinc-700 h-20 text-center cursor-pointer hover:bg-lavender-50/50 dark:hover:bg-zinc-700/30 transition-colors group" onclick="openAddLessonModal(${dIdx}, ${slot.index}, '${slot.start}', '${slot.end}')">
                                <div class="w-full h-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-lavender-500">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </div>
                            </td>`;
                        }
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table>`;
            }

            wrapper.innerHTML = html;
        }

        function renderSubjectsDatalist() {
            const datalist = document.getElementById('subjectsDatalist');
            datalist.innerHTML = '';
            state.subjects.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.name;
                datalist.appendChild(opt);
            });
        }

        function renderSubjectsList() {
            const container = document.getElementById('subjectsListContainer');
            container.innerHTML = '';
            state.subjects.forEach((s, idx) => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2.5 rounded-xl bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-5 h-5 rounded-lg border border-zinc-300 dark:border-zinc-700 shadow-xs" style="background-color: ${s.color};"></span>
                        <span class="text-xs font-semibold text-zinc-800 dark:text-zinc-200">${s.name}</span>
                    </div>
                    <button onclick="deleteSubject(${idx})" class="text-zinc-400 hover:text-red-500 transition-colors text-xs p-1"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(div);
            });
        }

        window.deleteSubject = function(idx) {
            state.subjects.splice(idx, 1);
            saveState();
            renderAll();
        };

        window.openModal = function(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                ['lessonModal', 'subjectsModal', 'settingsModal', 'excludedModal'].forEach(id => closeModal(id));
            }
        });

        document.querySelectorAll('.fixed.inset-0').forEach(modalBg => {
            modalBg.addEventListener('click', (e) => {
                if (e.target === modalBg) {
                    modalBg.classList.add('hidden');
                }
            });
        });

        window.openAddLessonModal = function(dayIndex, slotIndex, startTime, endTime) {
            document.getElementById('lessonModalTitle').textContent = translations[state.lang].addLesson;
            document.getElementById('lessonId').value = '';
            document.getElementById('lessonDay').value = dayIndex;
            document.getElementById('lessonTimeSlotIndex').value = slotIndex;
            document.getElementById('lessonSubject').value = '';
            document.getElementById('lessonStartTime').value = startTime;
            document.getElementById('lessonEndTime').value = endTime;
            document.getElementById('lessonSlotSpan').value = '1';
            document.getElementById('lessonTeacher').value = '';
            document.getElementById('lessonRoom').value = '';
            document.getElementById('deleteLessonBtn').classList.add('hidden');
            openModal('lessonModal');
        };

        window.openEditLessonModal = function(lessonId) {
            const t = state.timetables[state.activeTableId];
            const l = t.lessons.find(item => item.id === lessonId);
            if (!l) return;

            document.getElementById('lessonModalTitle').textContent = "Edit Lesson";
            document.getElementById('lessonId').value = l.id;
            document.getElementById('lessonDay').value = l.dayIndex;
            document.getElementById('lessonTimeSlotIndex').value = l.slotIndex;
            document.getElementById('lessonSubject').value = l.subject;
            document.getElementById('lessonStartTime').value = l.startTime;
            document.getElementById('lessonEndTime').value = l.endTime;
            document.getElementById('lessonSlotSpan').value = l.span || 1;
            document.getElementById('lessonTeacher').value = l.teacher || '';
            document.getElementById('lessonRoom').value = l.room || '';
            document.getElementById('deleteLessonBtn').classList.remove('hidden');
            openModal('lessonModal');
        };

        function populateSettingsForm() {
            const t = state.timetables[state.activeTableId];
            document.getElementById('settingTitleInput').value = t.title;
            document.getElementById('settingDaysCount').value = t.daysCount;
            document.getElementById('settingSlotsCount').value = t.slotsCount;
            document.getElementById('settingStartTime').value = t.startTime;
            document.getElementById('settingSlotDuration').value = t.slotDuration;
        }

        function populateExcludedModal() {
            const t = state.timetables[state.activeTableId];
            const langDict = translations[state.lang];
            
            const slotSelect = document.getElementById('excludeSlotIndex');
            slotSelect.innerHTML = '';
            const slots = generateTimeSlots(t);
            slots.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.index;
                opt.textContent = `Slot ${s.index + 1} (${s.start} - ${s.end})`;
                slotSelect.appendChild(opt);
            });

            const daysContainer = document.getElementById('excludeDaysCheckboxes');
            daysContainer.innerHTML = '';
            const daysNames = langDict.days.slice(0, t.daysCount);
            daysNames.forEach((dName, dIdx) => {
                const label = document.createElement('label');
                label.className = "flex items-center gap-2 text-xs font-medium bg-white dark:bg-zinc-800 px-3 py-1.5 rounded-xl border border-offwhite-300 dark:border-zinc-700 cursor-pointer";
                label.innerHTML = `<input type="checkbox" value="${dIdx}" class="exclude-day-cb rounded accent-lavender-600" checked> ${dName}`;
                daysContainer.appendChild(label);
            });

            const activeContainer = document.getElementById('exclusionsListContainer');
            activeContainer.innerHTML = '';
            if (t.exclusions.length === 0) {
                activeContainer.innerHTML = `<p class="text-xs text-zinc-400 italic">No active restrictions.</p>`;
            } else {
                t.exclusions.forEach((exc, idx) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-2.5 rounded-xl bg-offwhite-100 dark:bg-zinc-900 border border-offwhite-300 dark:border-zinc-700 text-xs";
                    const daysStr = exc.days.map(d => daysNames[d]).join(', ');
                    div.innerHTML = `
                        <div>
                            <span class="font-bold uppercase text-[10px] px-2 py-0.5 rounded-md ${exc.type === 'delete' ? 'bg-red-100 text-red-700 dark:bg-red-950/60 dark:text-red-300' : 'bg-yellow-100 text-yellow-700 dark:bg-yellow-950/60 dark:text-yellow-300'}">${exc.type}</span>
                            <span class="ml-2 font-medium">Slot ${exc.slotIndex + 1} (${daysStr})</span>
                        </div>
                        <button onclick="removeExclusion(${idx})" class="text-zinc-400 hover:text-red-500 transition-colors p-1"><i class="fa-solid fa-xmark"></i></button>
                    `;
                    activeContainer.appendChild(div);
                });
            }
        }

        window.removeExclusion = function(idx) {
            const t = state.timetables[state.activeTableId];
            t.exclusions.splice(idx, 1);
            saveState();
            populateExcludedModal();
            renderAll();
            showToast(translations[state.lang].toastDeleted);
        };

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = "bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 text-xs font-semibold px-4 py-3 rounded-2xl shadow-xl transition-all duration-300 pointer-events-auto flex items-center gap-2 translate-y-2 opacity-0";
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-lavender-400"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
